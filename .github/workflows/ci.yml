name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: License and source gate
        run: cargo deny check

  bench:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate bench repo
        run: |
          scripts/gen-bench-repo.sh "$RUNNER_TEMP/lucerna-bench"
          echo "LUCERNA_BENCH_REPO=$RUNNER_TEMP/lucerna-bench" >> "$GITHUB_ENV"
      # The PR's base and the PR are measured in this one job, so both runs
      # share a runner and its speed cancels out. The base may predate
      # bench-run.sh, so it runs from a copy taken out of the tree first.
      - name: Measure base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp scripts/bench-run.sh "$RUNNER_TEMP/bench-run.sh"
          git checkout --detach "$BASE_SHA"
          sh "$RUNNER_TEMP/bench-run.sh" save
      - name: Measure PR
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          scripts/bench-run.sh compare
          scripts/bench-gate.sh target/criterion 15
