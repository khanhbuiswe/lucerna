name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: License and source gate
        run: cargo deny check

  bench:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate bench repo
        run: |
          scripts/gen-bench-repo.sh "$RUNNER_TEMP/lucerna-bench"
          echo "LUCERNA_BENCH_REPO=$RUNNER_TEMP/lucerna-bench" >> "$GITHUB_ENV"
      # The PR's base and the PR are measured in this one job, so both runs
      # share a runner. The base may predate bench-run.sh, so it runs from a
      # copy taken out of the tree first.
      - name: Measure base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp scripts/bench-run.sh "$RUNNER_TEMP/bench-run.sh"
          git checkout --detach "$BASE_SHA"
          sh "$RUNNER_TEMP/bench-run.sh" save
      - name: Measure PR
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          scripts/bench-run.sh compare
      # Report only: on shared macOS runners identical code still swings
      # about -20%..+30% within one job (PR #2), so the 15% gate would fail
      # on noise. The table goes to the job summary; a slowdown is a warning.
      - name: Bench report
        run: |
          status=0
          scripts/bench-gate.sh target/criterion 15 > bench-gate.txt || status=$?
          cat bench-gate.txt
          {
            echo '### Bench vs PR base (report only, 15% threshold)'
            echo '```'
            cat bench-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Bench::Some benches are over 15% slower than the PR base; runner noise is often this large, so check the job summary."
          fi
