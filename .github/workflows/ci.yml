name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: English check tests
        run: python3 -m unittest scripts/test_check_english.py
      - name: English only
        run: python3 scripts/check-english.py scan
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: License and source gate
        run: cargo deny check

  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate bench repo
        run: |
          scripts/gen-bench-repo.sh "$RUNNER_TEMP/lucerna-bench"
          echo "LUCERNA_BENCH_REPO=$RUNNER_TEMP/lucerna-bench" >> "$GITHUB_ENV"
      # Pull requests compare against the baseline saved by the last push to main.
      - name: Restore main baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
          restore-keys: criterion-main-
      # Benches are listed per crate so gpui-dependent crates are never built.
      - name: Save main baseline
        if: github.event_name == 'push'
        run: |
          cargo bench -p lucerna-project --bench scan --bench fuzzy -- --save-baseline main
          cargo bench -p lucerna-syntax --bench highlight -- --save-baseline main
          cargo bench -p lucerna-text --bench reload -- --save-baseline main
      - name: Cache main baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
      - name: Compare with main baseline
        if: github.event_name == 'pull_request'
        run: |
          cargo bench -p lucerna-project --bench scan --bench fuzzy -- --baseline main
          cargo bench -p lucerna-syntax --bench highlight -- --baseline main
          cargo bench -p lucerna-text --bench reload -- --baseline main
          scripts/bench-gate.sh target/criterion 15
