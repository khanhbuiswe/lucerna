name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/test_check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the site checker
        run: python3 -m unittest scripts/test_check_site.py
      - name: Check the site
        run: python3 scripts/check-site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
