name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/test_check_site.py"
      - "scripts/test_brand.py"
      - "scripts/test_bundle_plist.py"
      - "scripts/render-plist.sh"
      - "scripts/bundle-app.sh"
      - "crates/lucerna/resources/macos/Info.plist"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - "scripts/test_check_site.py"
      - "scripts/test_brand.py"
      - "scripts/test_bundle_plist.py"
      - "scripts/render-plist.sh"
      - "scripts/bundle-app.sh"
      - "crates/lucerna/resources/macos/Info.plist"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the site checker
        run: python3 -m unittest scripts/test_check_site.py
      - name: Test the brand files
        run: python3 -m unittest scripts/test_brand.py
      - name: Test the app bundle's Info.plist
        run: python3 -m unittest scripts/test_bundle_plist.py
      - name: Check the site
        run: python3 scripts/check-site.py site

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
