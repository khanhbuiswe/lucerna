[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucerna-dev/lucerna"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates
lucerna-workbench = { path = "crates/lucerna-workbench" }
lucerna-settings = { path = "crates/lucerna-settings" }
lucerna-text = { path = "crates/lucerna-text" }
lucerna-editor = { path = "crates/lucerna-editor" }
lucerna-project = { path = "crates/lucerna-project" }
lucerna-syntax = { path = "crates/lucerna-syntax" }
lucerna-theme = { path = "crates/lucerna-theme" }
lucerna-extension = { path = "crates/lucerna-extension" }
lucerna-vim = { path = "crates/lucerna-vim" }
lucerna-lsp = { path = "crates/lucerna-lsp" }

# CLI
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"

# Settings
jsonc-parser = { version = "0.26", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Text
ropey = { version = "1", default-features = false, features = ["simd"] }
encoding_rs = "0.8"
chardetng = "1"

# Project
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
notify = "8"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std", "smallvec", "tracing-log"] }
tracing-appender = "0.2"
futures = "0.3"
nucleo-matcher = "0.3"
tempfile = "3"
sha2 = "0.10"
toml = "0.8"
globset = "0.4"
libc = "0.2"

# Syntax: one tree-sitter core; every grammar exposes `LANGUAGE: LanguageFn`.
tree-sitter = { version = "0.27", features = ["wasm"] }
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
insta = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# LSP
lsp-types = "0.97"
pulldown-cmark = { version = "0.13", default-features = false }

unicode-width = "0.2"
url = "2"
unicode-segmentation = "1"
similar = "2"

# UI: only lucerna-workbench may depend on these. Pinned to one Zed commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["font-kit", "runtime_shaders"] }

# Keep build output small: the dev disk is tight. `test` inherits from `dev`.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Keep hot paths fast in debug builds.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.ropey]
opt-level = 3
