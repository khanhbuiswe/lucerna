[package]
name = "lucerna-workbench"
description = "Lucerna workbench UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel.workspace = true
encoding_rs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
jsonc-parser.workspace = true
lsp-types.workspace = true
lucerna-editor.workspace = true
lucerna-extension.workspace = true
lucerna-git.workspace = true
lucerna-lsp.workspace = true
lucerna-project.workspace = true
lucerna-settings.workspace = true
lucerna-syntax.workspace = true
lucerna-terminal.workspace = true
lucerna-text.workspace = true
lucerna-theme.workspace = true
lucerna-vim.workspace = true
notify.workspace = true
nucleo-matcher.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
lucerna-extension = { workspace = true, features = ["test-support"] }
lucerna-lsp = { workspace = true, features = ["test-support"] }
lucerna-terminal = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
toml.workspace = true

# The platform text system can only be created on the main thread, so this
# test supplies its own `main` instead of the libtest harness.
[[test]]
name = "fonts"
harness = false

# A measurement with the platform's real text system (main thread only, as
# above); skipped unless run with `--ignored`.
[[test]]
name = "terminal_perf"
harness = false
