[package]
name = "lucerna"
description = "Lucerna: a read-only code viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "luc"
path = "src/main.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
lucerna-extension.workspace = true
lucerna-lsp.workspace = true
lucerna-settings.workspace = true
lucerna-workbench.workspace = true
nucleo-matcher.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
libc.workspace = true
tempfile.workspace = true
lucerna-extension = { workspace = true, features = ["test-support"] }
lucerna-lsp = { workspace = true, features = ["test-support"] }
